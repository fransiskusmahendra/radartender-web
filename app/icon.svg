<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Radar Circle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" />
  <!-- Middle Radar Circle -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.7" />
  <!-- Center Target Dot -->
  <circle cx="32" cy="32" r="5" fill="url(#grad)" />
  
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="20" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="44" x2="32" y2="58" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="32" x2="20" y2="32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="32" x2="58" y2="32" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  
  <!-- Radar Sweep Blip -->
  <circle cx="43" cy="21" r="3" fill="#34d399" />
</svg>
